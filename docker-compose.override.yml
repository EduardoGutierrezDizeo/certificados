# SOLO DESARROLLO LOCAL, NUNCA PRODUCCIÓN.
# Override que docker compose aplica automáticamente (docker compose up).
# Activa DRY_RUN=true (no lanza Playwright, no toca portales reales y no reporta
# a Laravel) y baja el límite de RNMC a 2 para demostrar que el semáforo
# distribuido limita GLOBALMENTE entre réplicas.
#
# Este archivo NO debe copiarse ni referenciarse jamás en el VPS de producción:
# docker stack deploy (docker-stack.prod.yml) lo ignora por diseño, y si se
# usara con compose en producción pondría el worker en DRY_RUN sin tocar portales.
#
# docker compose up -d --scale worker=2   (usa este override automáticamente)
services:
  worker:
    environment:
      DRY_RUN: "true"
      DRY_RUN_DURATION_SECONDS: "2"
      MAX_CONCURRENCY_RNMC: "2"
      MAX_CONCURRENCY_CONTRALORIA: "2"
      MAX_CONCURRENCY_POLICIA_JUDICIAL: "2"
      MAX_CONCURRENCY_PROCURADURIA: "1"
