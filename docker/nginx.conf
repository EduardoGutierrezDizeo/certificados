user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # El worker Python sube PDFs al endpoint interno de certificados con
    # multipart; se permite hasta 20M de cuerpo por request.
    client_max_body_size 20M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;
        server_tokens off;

        # Bloque típico de Laravel: cualquier ruta que no sea un archivo real
        # se redirige a index.php (front controller). Se omite el fallback
        # "$uri/" a propósito: evita que nginx haga match con directorios
        # reales o symlinks (p. ej. public/storage creado por storage:link) e
        # intente servir su índice, lo que devolvía 403 en /storage/ antes de
        # llegar a Laravel.
        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # Bloquea acceso a archivos ocultos de dotfiles y de Git, excepto
        # la ruta estándar /.well-known (p. ej. validación de dominios ACME).
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}