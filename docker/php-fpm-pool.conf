; Pool de PHP-FPM de CertiCheck (sobrescribe el archivo por defecto).
; Escucha en TCP 127.0.0.1:9000, donde nginx hace fastcgi_pass.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; clear_env = no: php-fpm conserva las variables de entorno del contenedor
; para que Laravel lea config('...') desde ENV al hacer config:cache.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Los logs del pool van a stdout/stderr del contenedor (visibles en Coolify).
catch_workers_output = yes
access.log = /proc/self/fd/2