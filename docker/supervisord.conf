# supervisord: proceso principal del contenedor. Levanta y supervisa los
# tres procesos que necesita la app en producción:
#   - php-fpm   : ejecuta la app Laravel.
#   - nginx     : sirve el front controller (public/) y pasa PHP a php-fpm.
#   - scheduler : loop que corre `php artisan schedule:run` cada minuto
#                 (ejecuta la tarea diaria subscriptions:notify-expiring).
#
# Se eligió loop de supervisord en lugar de cron real porque así los tres
# procesos viven bajo el mismo árbol de gestor de procesos: logs unificados
# en stdout del contenedor, reinicio automático ante crash, y arranque/
# apagado ordenado junto con el resto (SIGTERM al contenedor apaga todo).
# Laravel se encarga de ejecutar cada tarea como máximo una vez por minuto,
# así que invocar schedule:run cada 60s es idempotente.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
user=root
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/schedule.sh
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0