; Ajustes de PHP para producción (sobrescriben los defaults del contenedor).
memory_limit = 256M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

; Subidas multipart del worker Python (debe ir en línea con
; client_max_body_size 20M de nginx).
upload_max_filesize = 20M
post_max_size = 21M

; OPcache activado y sin revalidar por request (código inmutable tras build).
opcache.enable = 1
opcache.cli_enable = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1